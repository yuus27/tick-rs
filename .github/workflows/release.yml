# Bouwt tick. voor Windows en zet de installer + portable .exe (met latest.yml voor auto-update) in GitHub Releases.
# Een release start vanzelf zodra "version" in package.json een nummer heeft waarvoor nog geen release bestaat.
# Ook mogelijk: een tag vX.Y.Z pushen, of handmatig via Actions → Release → Run workflow.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V bestaat al, niets te doen."; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nieuwe versie v$V: bouwen."; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Versienummer zetten
        shell: bash
        run: npm version "${{ needs.check.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Bouwen en publiceren
        run: npm run release:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
