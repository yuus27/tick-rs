# Maakt verse screenshots voor de README met live wiki-data en zet ze in docs/screenshots.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/screenshots.mjs, .github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TICK_DATA_DIR: /tmp/tickdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: tick. starten
        run: |
          node server/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5177/api/health && break; sleep 1; done
      - run: node docs/screenshots.mjs
      - name: Server-log bij fouten
        if: failure()
        run: tail -50 /tmp/server.log
      - name: Screenshots committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "Screenshots bijgewerkt [skip ci]" && git push)
